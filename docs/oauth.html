<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festive Playlists — Spotify authorization</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 16px/1.5 system-ui, sans-serif;
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem;
    }
    h1 { font-size: 1.4rem; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      font: inherit;
      padding: .65rem;
    }
    textarea { min-height: 7rem; word-break: break-all; }
    button { margin-top: .75rem; cursor: pointer; }
    .status { padding: .75rem; border-radius: .4rem; background: #eee; }
    .error { background: #fdd; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Festive Playlists</h1>
    <p class="status" id="status">Loading…</p>

    <section id="client-box" hidden>
      <p>
        Paste your Spotify app's Client ID. It is not secret and is stored only
        in this browser.
      </p>
      <label for="client-id">Client ID</label>
      <input id="client-id" autocomplete="off" spellcheck="false">
      <button id="start" type="button">Authorize with Spotify</button>
    </section>

    <section id="token-box" hidden>
      <p>
        Authorization succeeded. Copy this refresh token and add it to GitHub
        Actions as the <code>SPOTIFY_REFRESH_TOKEN</code> secret.
      </p>
      <label for="token">Refresh token</label>
      <textarea id="token" readonly></textarea>
      <button id="copy" type="button">Copy token</button>
    </section>
  </main>

  <script>
    const SCOPES = [
      "user-library-read",
      "user-library-modify",
      "playlist-read-private",
      "playlist-modify-private",
    ].join(" ");
    const redirectUri = location.origin + location.pathname;
    const params = new URLSearchParams(location.search);
    const statusEl = document.getElementById("status");
    const clientBox = document.getElementById("client-box");
    const tokenBox = document.getElementById("token-box");
    const clientInput = document.getElementById("client-id");
    const tokenArea = document.getElementById("token");

    function base64url(bytes) {
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    async function challengeFor(verifier) {
      const digest = await crypto.subtle.digest(
        "SHA-256", new TextEncoder().encode(verifier)
      );
      return base64url(new Uint8Array(digest));
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    async function startAuthorization() {
      const clientId = clientInput.value.trim();
      if (!clientId) {
        setStatus("Enter your Spotify Client ID first.", true);
        return;
      }
      localStorage.setItem("spotify_client_id", clientId);
      const verifier = base64url(crypto.getRandomValues(new Uint8Array(64)));
      const state = base64url(crypto.getRandomValues(new Uint8Array(16)));
      localStorage.setItem("pkce_verifier", verifier);
      localStorage.setItem("pkce_state", state);
      const url = new URL("https://accounts.spotify.com/authorize");
      url.search = new URLSearchParams({
        client_id: clientId,
        response_type: "code",
        redirect_uri: redirectUri,
        scope: SCOPES,
        state,
        code_challenge_method: "S256",
        code_challenge: await challengeFor(verifier),
      }).toString();
      location.assign(url.toString());
    }

    async function finishAuthorization(code, state) {
      const expected = localStorage.getItem("pkce_state");
      const verifier = localStorage.getItem("pkce_verifier");
      const clientId = localStorage.getItem("spotify_client_id");
      if (!expected || state !== expected) {
        throw new Error("State mismatch. Close this tab and try again.");
      }
      if (!verifier || !clientId) {
        throw new Error("Missing PKCE values. Start again from this page.");
      }
      const body = new URLSearchParams({
        grant_type: "authorization_code",
        code,
        redirect_uri: redirectUri,
        client_id: clientId,
        code_verifier: verifier,
      });
      const response = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error_description || data.error || "Token exchange failed");
      }
      localStorage.removeItem("pkce_verifier");
      localStorage.removeItem("pkce_state");
      history.replaceState({}, "", redirectUri);
      tokenArea.value = data.refresh_token || "";
      tokenBox.hidden = false;
      setStatus("Authorized. Copy the refresh token below.");
    }

    async function main() {
      const error = params.get("error");
      if (error) {
        setStatus("Spotify returned an error: " + error, true);
        return;
      }
      const code = params.get("code");
      if (code) {
        try {
          setStatus("Exchanging the authorization code…");
          await finishAuthorization(code, params.get("state") || "");
        } catch (err) {
          setStatus(err.message, true);
        }
        return;
      }
      clientInput.value = localStorage.getItem("spotify_client_id") || "";
      clientBox.hidden = false;
      setStatus("Ready. Enter your Client ID and authorize.");
    }

    document.getElementById("start").addEventListener("click", startAuthorization);
    document.getElementById("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(tokenArea.value);
      setStatus("Token copied.");
    });
    main();
  </script>
</body>
</html>
